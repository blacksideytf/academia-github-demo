<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica Sonrisa · demo</title>
  <style>
    :root { --fondo: #f6f8fb; --texto: #1d2433; --acento: #2e7d6b; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    .aviso { background: #fff4d6; border: 1px solid #e8c766; padding: 12px 16px; border-radius: 8px; }
    a.boton { display: inline-block; background: var(--acento); color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="aviso">Web de demostración de la academia NexumIA. La clínica y los datos son ficticios.</p>
    <h1>Clínica Sonrisa</h1>
    <p>Pide tu cita en un minuto. Te confirmamos por email el mismo día.</p>
    <p><a class="boton" href="#">Pedir cita (demo)</a></p>
    <h2>Estado del sistema</h2>
    <ul>
      <li>Formulario de citas: funcionando</li>
      <li>Recordatorio 24 h antes: funcionando</li>
    </ul>
  </main>
</body>
</html>
